[include fluidd.cfg] 
[include mks-robin-nano-v3x.cfg]

[force_move]
enable_force_move: True

[printer]
kinematics: corexz
max_velocity: 200
max_accel: 1000
max_z_velocity: 50
max_z_accel: 1000
square_corner_velocity: 4.0

[mcu]
serial: /dev/ttyAMA0
baud: 250000
restart_method: command

#####################################################################
# 	X Stepper Settings
#####################################################################

# NEMA17 1.8° SIBOOR-42STH38-1504B
[stepper_x]
step_pin: X_STEP
dir_pin: X_DIR
enable_pin: !X_ENABLE
rotation_distance: 40
full_steps_per_rotation: 200
microsteps: 32
endstop_pin: !X_STOP
position_endstop: 235
position_min: 0
position_max: 235
homing_speed: 50
homing_positive_dir: true

[tmc2209 stepper_x]
uart_pin: X_UART
#tx_pin: X_UART
run_current: 0.9
hold_current: 0.50
interpolate: False
stealthchop_threshold: 0

#####################################################################
#   Y Stepper Settings
#####################################################################

# NEMA17 1.8° SIBOOR-42STH38-1504B
[stepper_y]
step_pin: Y_STEP
dir_pin: Y_DIR
enable_pin: !Y_ENABLE
rotation_distance: 40
full_steps_per_rotation: 200
microsteps: 32
endstop_pin: Y_STOP 
position_endstop: -5
position_min: -5
position_max: 235
homing_speed: 50
homing_positive_dir: false

[tmc2209 stepper_y]
uart_pin: Y_UART
# tx_pin: Y_UART
run_current: 0.9    #1.0 default Marlin fmw
hold_current: 0.50
interpolate: False
stealthchop_threshold: 0

#####################################################################
# 	Z Stepper Settings
#####################################################################

# NEMA17 1.8° SIBOOR-42STH38-1504B
[stepper_z]
step_pin: Z_STEP
dir_pin: Z_DIR
enable_pin: !Z_ENABLE
rotation_distance: 40
full_steps_per_rotation: 200
microsteps: 32
endstop_pin: probe:z_virtual_endstop
position_max: 220
homing_speed: 10
position_min: 0.0

[tmc2209 stepper_z]
uart_pin: Z_UART
# tx_pin: Z_UART
run_current: 0.9
hold_current: 0.50
interpolate: False
stealthchop_threshold: 0

#####################################################################
#   Extruder Settings
#####################################################################

# Sherpa Mini
# SIBOOR-14STH20-1004B 36mm
[extruder]
step_pin: E0_STEP
dir_pin: !E0_DIR
enable_pin: !E0_ENABLE
rotation_distance: 22.6789511   #Bondtech 5mm Drive Gears
gear_ratio: 50:10
microsteps: 16
full_steps_per_rotation: 200
nozzle_diameter: 0.400
filament_diameter: 1.75
heater_pin: HE0
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: HE0_TEMP
min_temp: 10
max_temp: 300
max_power: 1.0
min_extrude_temp: 170
#pressure_advance: .05
# pressure_advance_smooth_time: 0.040
max_extrude_only_distance: 100.0
max_extrude_only_velocity: 75.0
max_extrude_only_accel: 1500

[tmc2209 extruder]
uart_pin: E0_UART
# tx_pin: E0_UART
run_current: 0.45 #0.8 default Marlin fmw
interpolate: True

#####################################################################
# 	Bed Heater
#####################################################################

[heater_bed]
heater_pin: BED
sensor_type: Generic 3950
sensor_pin: BED_TEMP
min_temp: 0
max_temp: 130
control: pid
pid_kp: 58.437
pid_ki: 2.347
pid_kd: 363.769

#####################################################################
# 	Fan Control
#####################################################################

######
# Hot End Fan
###############
[heater_fan extruder_fan]
pin: FAN1
heater: extruder
heater_temp: 50.0

######
# Part Cooling Fan
###############
[fan]
pin: FAN0
cycle_time: .08
##	Depending on your fan, you may need to increase this value
##	if your fan will not start. Can change cycle_time (increase)
##	if your fan is not able to slow down effectively
kick_start_time: .25

#####################################################################
#   Homing and Bed Mesh
#####################################################################

# Voron Tap
[include voron-tap.cfg]

[homing_override]
axes: z
set_position_z: 0
gcode:
    G90
    G0 Z5 F500
    G28 X Y
    G0 X117.5 Y117.5 F9000
    G28 Z
    G0 Z5 F500

[bed_mesh]
speed: 80
horizontal_move_z: 5
mesh_min: 25,35.0
mesh_max: 220,220
probe_count: 6,6
algorithm: bicubic
bicubic_tension: 0.2
mesh_pps: 2,2
fade_start: 1
fade_end: 10
fade_target: 0

#####################################################################
# 	Displays
#####################################################################
[include mks_mini_12864_v3.cfg]

#####################################################################
# 	Macros
#####################################################################

[gcode_macro PRINT_START]
#   Use PRINT_START for the slicer starting script - PLEASE CUSTOMISE THE SCRIPT
gcode:
    # 1. Gather temperatures from your slicer
    {% set BED_TEMP = params.BED|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER|default(200)|float %}
    
    # 2. Start heating the bed and wait for it
    M117 Heating bed...
    M190 S{BED_TEMP}
    
    # Optional: You can explicitly heat the nozzle to 150C here for probing, 
    # but the voron-tap.cfg's activate_gcode will automatically handle it when probing later.
    M109 S150

    # 3. Home axes and generate mesh (safe to do now with nozzle at 150C)
    M117 Homing and Probing...
    G28
    BED_MESH_CALIBRATE
    
    # 4. Move to printing start position and heat to full temp
    G90
    G1 Z15.0 F600                      ; move the platform down 15mm
    G1 X117.5 Y117.5 F9000             ; move to center
    M117 Heating Hotend...
    M109 S{EXTRUDER_TEMP}              ; heat to final extrusion temp and wait
    
    # 5. Clean / purge (uncomment below if you want a purge line)
    #G92 E0                            ; zero the extruded length
    #G0 X5 Y5 F6000
    #G0 Z0.4
    #G1 X120 E30 F1200
    #G1 Y1
    #G1 X5 E30 F1200
    
    G92 E0                             ; zero the extruded length again
    M117 Printing...


[gcode_macro PRINT_END]
#   Use PRINT_END for the slicer ending script
gcode:
    #   Get Boundaries
    {% set max_x = printer.configfile.config["stepper_x"]["position_max"]|float %}
    {% set max_y = printer.configfile.config["stepper_y"]["position_max"]|float %}
    {% set max_z = printer.configfile.config["stepper_z"]["position_max"]|float %}
    
    #   Check end position to determine safe directions to move
    {% if printer.toolhead.position.x < (max_x - 20) %}
        {% set x_safe = 20.0 %}
    {% else %}
        {% set x_safe = -20.0 %}
    {% endif %}

    {% if printer.toolhead.position.y < (max_y - 20) %}
        {% set y_safe = 20.0 %}
    {% else %}
        {% set y_safe = -20.0 %}
    {% endif %}

    {% if printer.toolhead.position.z < (max_z - 2) %}
        {% set z_safe = 2.0 %}
    {% else %}
        {% set z_safe = max_z - printer.toolhead.position.z %}
    {% endif %}
    
    #  Commence PRINT_END
    M400                             ; wait for buffer to clear
    G92 E0                           ; zero the extruder
    G1 E-4.0 F3600                   ; retract
    G91                              ; relative positioning
    G0 Z{z_safe} F3600               ; move nozzle up
    G0 X{x_safe} Y{y_safe} F20000    ; move nozzle to remove stringing
    
    M104 S0                          ; turn off hotend
    M140 S0                          ; turn off bed
    M106 S0                          ; turn off fan
    G90                              ; absolute positioning
    G0 X{max_x / 2} Y{max_y} F3600   ; park nozzle at rear
    M117 Finished!

